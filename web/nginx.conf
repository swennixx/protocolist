server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8000;
        client_max_body_size 16m;       # uploads come in 8 MB chunks
        proxy_request_buffering off;
        proxy_buffering off;            # progress and answers stream as Server-Sent Events
        proxy_read_timeout 1h;
    }

    location / {
        try_files $uri /index.html;
    }
}
